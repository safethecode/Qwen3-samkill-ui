<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference component prototype</title><link rel="stylesheet" href="styles.css"></head><body><main class="frame"><header class="e1-header" data-ui-unit="E1">
  <h2 class="e1-title">멘토 찾기</h2>
  <div class="e1-tools">
    <img src="assets/icons/Bell-quiet.svg" alt="알림" class="e1-icon">
    <img src="assets/icons/Heart-quiet.svg" alt="찜" class="e1-icon">
    <img src="assets/icons/UserRound-quiet.svg" alt="프로필" class="e1-icon">
  </div>
</header><div class="search-slot"><div data-ui-unit="E2" class="search-unit"><label for="search" class="search-label">멘토 검색</label><div class="search-surface"><img src="assets/reference/search.svg" alt="" width="20" height="20"><input id="search" type="search" placeholder="멘토 또는 회사를 검색하세요"></div></div></div><div class="chips-slot"><div class="e3" data-ui-unit="E3" role="group" aria-label="상담 분야">
  <button class="chip chip-selected" disabled type="button">전체</button>
  <button class="chip" disabled type="button">커리어</button>
  <button class="chip" disabled type="button">자소서</button>
  <button class="chip" disabled type="button">면접</button>
</div></div><section class="mentor-list" aria-label="멘토 예시"><article class="mentor-card"><div data-ui-unit="E4a" class="e4a-card">
  <button class="e4a-fav-btn" disabled aria-label="김서연 찜한 상태 예시" aria-pressed="true">
    <img src="assets/icons/Heart-selected.svg" alt="찜하기" class="e4a-fav-icon">
  </button>
  <div class="e4a-header">
    <img src="assets/reference/avatar-1.png" alt="김서연 프로필" class="e4a-avatar">
    <div class="e4a-text-col">
      <span class="e4a-name">김서연</span>
      <div class="e4a-meta">
        <img src="assets/reference/bookmark-check.svg" alt="" class="e4a-badge-icon">
        <span class="e4a-badge">현직</span>
        <span class="e4a-divider"></span>
        <span class="e4a-company">스타트업 A</span>
      </div>
    </div>
  </div>
</div><div class="body-slot"><div data-ui-unit="E5a" class="mentor-body"><p class="mentor-role">프로덕트 디자이너</p><p class="mentor-description">사용자의 문제를 함께 정리하고 포트폴리오의 방향을 제안합니다.</p><footer class="mentor-footer"><span>예시 39,000원 / 회</span><button type="button" disabled>상담</button></footer></div></div></article><article class="mentor-card"><div data-ui-unit="E4b" class="e4b-card">
  <div class="e4b-header">
    <div class="e4b-identity">
      <img class="e4b-avatar" src="assets/reference/avatar-2.png" alt="박민준 프로필 이미지">
      <div class="e4b-info">
        <div class="e4b-name">박민준</div>
        <div class="e4b-meta-row">
          <img class="e4b-badge-check" src="assets/reference/badge-check.svg" alt="인증">
          <span class="e4b-badge-label">인증</span>
          <span class="e4b-divider"></span>
          <span class="e4b-role">소프트웨어 개발</span>
        </div>
      </div>
    </div>
    <button class="e4b-action-btn" aria-pressed="false" disabled title="박민준 찜하지 않은 상태 예시">
      <img class="e4b-heart-icon" src="assets/reference/heart.svg" alt="찜">
    </button>
  </div>
</div><div class="body-slot"><div data-ui-unit="E5b" class="mentor-body"><p class="mentor-role">프론트엔드 개발자</p><p class="mentor-description">웹 접근성과 컴포넌트 설계를 함께 점검합니다.</p><footer class="mentor-footer"><span>예시 45,000원 / 회</span><button type="button" disabled>상담</button></footer></div></div></article></section><p class="disclosure">예시 화면 · 실제 상담 신청과 저장은 제공하지 않습니다.</p></main></body></html>
