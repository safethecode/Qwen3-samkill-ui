<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멘토 찾기</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="mentor-discovery-page">
        <header class="page-header">
            <h1 id="page-title">멘토 찾기</h1>
            <div id="search-container">
                <img src="assets/icons/Search.svg" alt="검색" width="20" height="20" aria-hidden="true">
                <label for="search" class="visually-hidden">멘토 검색</label>
                <input type="search" id="search" placeholder="멘토 이름, 기술 검색" disabled aria-disabled="true">
                <span class="example-disclosure">예시 데이터입니다.</span>
            </div>
        </header>

        <nav id="category-filters" class="chip-group" aria-label="카테고리 필터">
            <button type="button" class="chip active" disabled>전체</button>
            <button type="button" class="chip" disabled>디자인</button>
            <button type="button" class="chip" disabled>개발</button>
            <button type="button" class="chip" disabled>마케팅</button>
        </nav>

        <section id="mentor-list" aria-label="멘토 목록">
            
        </section>
    </main>
    <script src="app.js" defer></script>
</body>
</html>
