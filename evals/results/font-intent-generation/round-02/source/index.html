<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멘토 찾기</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="mentor-discovery-view" class="view-container">
        <header class="page-header">
            <h1 id="page-title">멘토 찾기</h1>
            <form id="search-form" role="search" class="search-bar">
                <img src="assets/icons/Search.svg" alt="" width="20" height="20" class="search-icon">
                <label for="search" class="visually-hidden">멘토 검색</label>
                <input type="search" id="search" name="search" placeholder="멘토 이름 또는 전문 분야 검색" disabled aria-label="멘토 이름 또는 전문 분야 검색">
                <span class="example-badge">예시</span>
            </form>
        </header>

        <nav id="category-chips" class="chip-list" aria-label="전문 분야 필터">
            <button type="button" class="chip active" disabled>전체</button>
            <button type="button" class="chip" disabled>디자인</button>
            <button type="button" class="chip" disabled>개발</button>
            <button type="button" class="chip" disabled>마케팅</button>
        </nav>

        <section id="mentor-list" class="mentor-grid">
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
